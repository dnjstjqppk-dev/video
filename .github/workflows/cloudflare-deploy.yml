name: Cloudflare Continuous Deployment

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-consoles:
    name: Build & Deploy Consoles to Cloudflare Workers / Pages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, studio, partners, admin]
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }} console with Cloudflare preset
        run: pnpm --filter @gvp/${{ matrix.app }} build
        env:
          NITRO_PRESET: cloudflare-module
          NUXT_PUBLIC_API_BASE_URL: /api

      - name: Deploy ${{ matrix.app }} via Wrangler
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

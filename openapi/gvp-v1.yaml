components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC JWT in production, dev tokens in test/development only
  parameters:
    VideoId:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
  schemas:
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: UNAUTHENTICATED
        message:
          type: string
          example: Authentication required
        request_id:
          type: string
          example: req_01J9X8Z2M4K1
        field:
          type: string
          example: title
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
    PlaybackInfo:
      type: object
      properties:
        videoId:
          type: string
        hlsMasterUrl:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

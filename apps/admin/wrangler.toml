#:schema ../../node_modules/wrangler/config-schema.json
name = "global-video-platform-admin"
main = "./.output/server/index.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./.output/public"
binding = "ASSETS"

# No [build] command: CI builds once with deploy env (see cloudflare-deploy.yml)
# and `wrangler deploy` uploads that .output. A [build] here would rebuild
# without env and silently drop the baked deploy metadata.


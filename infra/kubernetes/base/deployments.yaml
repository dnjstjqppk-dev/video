apiVersion: v1
kind: Namespace
metadata:
  name: gvp-prod
  labels:
    app.kubernetes.io/part-of: global-video-platform
    argocd.argoproj.io/instance: gvp-production
---
# ==============================================================================
# ZERO-TRUST NETWORK POLICIES
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gvp-default-deny-all
  namespace: gvp-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gvp-api-network-policy
  namespace: gvp-prod
spec:
  podSelector:
    matchLabels:
      app: gvp-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              tier: frontend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 5432   # PostgreSQL 18
        - protocol: TCP
          port: 6379   # Valkey
        - protocol: TCP
          port: 4222   # NATS JetStream
        - protocol: TCP
          port: 9200   # OpenSearch
        - protocol: TCP
          port: 8123   # ClickHouse
        - protocol: TCP
          port: 443    # Cloudflare R2 / Stream / ZITADEL OIDC
        - protocol: UDP
          port: 53     # CoreDNS
---
# ==============================================================================
# GO MODULAR MONOLITH API DEPLOYMENT, SERVICE & HPA
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gvp-api
  namespace: gvp-prod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: gvp-api
    tier: backend
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gvp-api
  template:
    metadata:
      labels:
        app: gvp-api
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/brand/gvp-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: gvp-backend-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gvp-api
  namespace: gvp-prod
spec:
  selector:
    app: gvp-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gvp-api-hpa
  namespace: gvp-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gvp-api
  minReplicas: 4
  maxReplicas: 24
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# ==============================================================================
# GO SEPARATED WORKERS (MEDIA, REALTIME-CHAT, ANALYTICS, RECOMMENDATION, SCHEDULER)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gvp-media-worker
  namespace: gvp-prod
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gvp-media-worker
  template:
    metadata:
      labels:
        app: gvp-media-worker
        tier: worker
    spec:
      nodeSelector:
        gvp.io/node-pool: media-transcode
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: media-worker
          image: ghcr.io/brand/gvp-media-worker:latest
          env:
            - name: WORKER_ROLE
              value: "media-transcoder"
          envFrom:
            - secretRef:
                name: gvp-backend-secrets
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "8000m"
              memory: "16Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gvp-media-worker-hpa
  namespace: gvp-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gvp-media-worker
  minReplicas: 3
  maxReplicas: 32
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gvp-realtime-chat
  namespace: gvp-prod
spec:
  replicas: 3
  selector:
    matchLabels:

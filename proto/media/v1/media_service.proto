syntax = "proto3";

package gvp.media.v1;

option go_package = "globalvideoplatform/services/api/internal/media/v1;mediav1";

service MediaWorkerService {
  rpc SubmitEncodingJob (SubmitEncodingJobRequest) returns (SubmitEncodingJobResponse);
  rpc GetJobStatus (GetJobStatusRequest) returns (GetJobStatusResponse);
  rpc CancelJob (CancelJobRequest) returns (CancelJobResponse);
}

message SubmitEncodingJobRequest {
  string job_id = 1;
  string video_id = 2;
  string source_r2_bucket = 3;
  string source_r2_key = 4;
  string destination_prefix = 5;
  repeated string target_qualities = 6; // e.g., ["240p", "360p", "480p", "720p", "1080p"]
  bool extract_thumbnails = 7;
  bool generate_storyboard = 8;
  bool normalize_audio = 9;
}

message SubmitEncodingJobResponse {
  string job_id = 1;
  string status = 2;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message OutputVariant {
  string quality = 1;
  string playlist_m3u8 = 2;
  int32 width = 3;
  int32 height = 4;
  int64 bitrate = 5;
}

message GetJobStatusResponse {
  string job_id = 1;
  string status = 2; // CREATED, PROCESSING, READY, FAILED
  int32 progress_percent = 3;
  string error_message = 4;
  string master_playlist_url = 5;
  repeated OutputVariant variants = 6;
  repeated string thumbnail_urls = 7;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  bool success = 1;
}


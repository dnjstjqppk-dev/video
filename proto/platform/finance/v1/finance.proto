syntax = "proto3";
package platform.finance.v1;
option go_package = "example.com/global-video-platform/gen/go/platform/finance/v1;financev1";
import "google/protobuf/timestamp.proto";
message Money {string currency=1;int64 amount_minor=2;}
message LedgerPosting {string account_id=1;string direction=2;Money amount=3;}
message PostLedgerTransactionRequest {string idempotency_key=1;string source_type=2;string source_ref=3;repeated LedgerPosting postings=4;}
message PostLedgerTransactionResponse {string transaction_id=1;google.protobuf.Timestamp posted_at=2;}
message CreatePaymentRequest {string actor_user_id=1;string idempotency_key=2;string provider=3;Money amount=4;string purpose=5;}
message CreatePaymentResponse {string payment_id=1;string provider_checkout_ref=2;}
message ProcessWebhookRequest {string provider=1;string provider_event_id=2;bytes verified_payload=3;}
message ProcessWebhookResponse {bool newly_processed=1;}
message RequestPayoutRequest {string payout_account_id=1;Money amount=2;string idempotency_key=3;}
message RequestPayoutResponse {string payout_id=1;string status=2;}
service FinanceService {rpc PostLedgerTransaction(PostLedgerTransactionRequest) returns (PostLedgerTransactionResponse);rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);rpc ProcessWebhook(ProcessWebhookRequest) returns (ProcessWebhookResponse);rpc RequestPayout(RequestPayoutRequest) returns (RequestPayoutResponse);}

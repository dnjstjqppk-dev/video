syntax = "proto3";
package platform.catalog.v1;
option go_package = "example.com/global-video-platform/gen/go/platform/catalog/v1;catalogv1";
import "google/protobuf/timestamp.proto";
message Channel {string id=1;string owner_id=2;string handle=3;string name=4;string description=5;string status=6;google.protobuf.Timestamp created_at=7;}
message Video {string id=1;string channel_id=2;string title=3;string description=4;string visibility=5;string status=6;string kind=7;int64 duration_ms=8;google.protobuf.Timestamp published_at=9;}
message CreateChannelRequest {string actor_user_id=1;string handle=2;string name=3;string description=4;}
message CreateChannelResponse {Channel channel=1;}
message GetChannelRequest {string channel_id=1;}
message GetChannelResponse {Channel channel=1;}
message CreateVideoDraftRequest {string actor_user_id=1;string channel_id=2;string title=3;string description=4;}
message CreateVideoDraftResponse {Video video=1;}
message GetVideoRequest {string video_id=1;string actor_user_id=2;}
message GetVideoResponse {Video video=1;}
message ListVideosRequest {string channel_id=1;string actor_user_id=2;int32 page_size=3;string page_token=4;}
message ListVideosResponse {repeated Video videos=1;string next_page_token=2;}
message PublishVideoRequest {string actor_user_id=1;string video_id=2;string visibility=3;}
message PublishVideoResponse {Video video=1;}
service CatalogService {
 rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
 rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
 rpc CreateVideoDraft(CreateVideoDraftRequest) returns (CreateVideoDraftResponse);
 rpc GetVideo(GetVideoRequest) returns (GetVideoResponse);
 rpc ListVideos(ListVideosRequest) returns (ListVideosResponse);
 rpc PublishVideo(PublishVideoRequest) returns (PublishVideoResponse);
}
